# shellcheck shell=bash
# ---------------------------------------------------------------------------
# defaults.conf — campaign-wide constants. Sourced by lib/*.sh.
# Override any of these via environment variable before running scripts/*.sh.
# ---------------------------------------------------------------------------

# --- Fletcher domain math (DO NOT change without re-auditing src/*.c) ------
# STENCIL: half-width of the 8th-order finite-difference scheme. Confirmed
# 2026-07-10 against include/definitions.h:4 (#define STENCIL 4) and the
# global-size formula in src/main.c:94-99 / src/coordinator.c:22-27:
#   global_size_per_axis = size_x_cli + 2*ABSORPTION + 2*STENCIL
# experiments.csv's Tamanho_Global_N is exactly this "global_size_per_axis"
# (cubic: same value used for x/y/z). The CLI conversion is therefore the
# algebraic inverse, identical to the formula already in nix/scripts.nix and
# g5k/06-sweep.sh — kept unchanged, just parameterized from the CSV instead
# of a hardcoded SIZES array.
: "${STENCIL:=4}"

# ABSORPTION: not a column in experimentos.csv (only Tamanho_Global_N,
# already computed assuming a fixed absorption). Kept identical to the
# existing convention in 06-sweep.sh. If the CSV generator used a different
# value, csv.sh's self-check (see lib/csv.sh: csv_selfcheck) will flag a
# mismatch against the one known-verified row (N=64 -> local 64x36x36)
# rather than silently producing wrong --size-x/y/z.
: "${ABSORPTION:=2}"

# DC_OUTPUT_FIELDS / DC_FLOAT_BYTES: coordinator.c's write loop
# (dc_receive_and_write_results, ~lines 183-205) writes exactly 2 fields
# (pc, qc) per global index, 4 bytes each (float). Used by
# csv_expected_dc_bytes to size the .dc preflight/integrity checks.
# Confirmed 2026-07-15: N=28 test run -> 175616 bytes == 28^3*2*4
# exactly; N=1536 real campaign file -> 28991029248 bytes == 1536^3*2*4
# exactly.
: "${DC_OUTPUT_FIELDS:=2}"
: "${DC_FLOAT_BYTES:=4}"

# --- Physics parameters (UNCHANGED from every validated run so far) -------
: "${DC_DX:=1e-1}"
: "${DC_DY:=1e-1}"
: "${DC_DZ:=1e-1}"
: "${DC_DT:=1e-6}"
: "${DC_TIME_MAX:=1e-4}"

# --- Hardware policy for THIS campaign --------------------------------
# Distinct from the generic, dynamic GPU census in lib/setup.sh (nvidia-smi
# based, no hardcoding, kept as-is). This is a STRICTER validation *policy*
# layered on top: experiments.csv assumes every physical node used has
# exactly this many GPUs. If a node reports fewer, validate.sh aborts the
# whole campaign rather than silently degrading it (unlike the earlier
# "adapt to whatever chuc-7 has" philosophy from the ad-hoc smoke-test
# sessions, which still lives on unmodified in g5k/02-setup.sh for that
# other, non-campaign use case).
: "${EXPECTED_GPUS_PER_NODE:=4}"

# GPU_VRAM_GB: nominal VRAM per GPU, used only to sanity-check
# VRAM_GB_por_GPU (CSV column, never recomputed) against real hardware.
# Observed on chuc-6/7/8 (session 1+2, nvidia-smi): NVIDIA A100-SXM4-40GB.
: "${GPU_VRAM_GB:=40}"
# Fraction of nominal VRAM considered safely usable (leaves room for CUDA
# context, driver reserve, Akypuera host-side buffers, etc.)
: "${VRAM_SAFETY_MARGIN:=0.85}"

# --- np=1 ground-truth feasibility (design doc secao 5.1-bis/5.0-quater) --
# DC_NP1_CUDA_ARRAYS / DC_NP1_OPENMP_ARRAYS: device_data.cu allocates
# EXACTLY 6 arrays (pp,pc,qp,qc,vpz,vsv) on the CUDA backend — confirmed
# 2026-07-14 by counting cudaMalloc calls in src/device_data.cu (lines
# 57,59,61,63,81,83); NOT the ~11-array model experiments.csv's VRAM
# column assumes. The OpenMP/host path additionally keeps the 10 precomp
# arrays + anisotropy fields in RAM (~20 arrays total per rank). For
# np=1, local==global, so an np=1 run must hold the FULL global domain —
# this is the basis for csv_ground_truth_backends' feasibility check.
: "${DC_NP1_CUDA_ARRAYS:=6}"
: "${DC_NP1_OPENMP_ARRAYS:=20}"
# HOST_RAM_GB: usable RAM per chuc node (Grid'5000 reference API, 2026-07-14).
: "${HOST_RAM_GB:=512}"
: "${RAM_SAFETY_MARGIN:=0.85}"

# --- Campaign policy --------------------------------------------------
: "${REPS_PER_EXPERIMENT:=5}"

# MIN_WALLTIME_MARGIN_S: safety margin (seconds) subtracted from
# oar_walltime_remaining_s before deciding whether to start a new
# rep/full-run, and used to cap RUN_TIMEOUT_S so a run is never launched
# with less time to finish than the reservation actually has left. This
# is a DELIBERATE SIMPLIFICATION of the fuller T_est*k model sketched in
# the design doc (secao 5.5): that model needs per-topology iteration-time
# calibration data that only exists for N=1536/np=8 so far
# (planning notes in g5k/logs/ on the main branch). Rather than extrapolate an
# unconfirmed T_est to every topology now, this fixed floor gives the
# same SAFETY property (never start what can't be bounded against the
# remaining walltime) with less precision; refining T_est per topology
# from data collected during the campaign itself is natural follow-up
# work, not a blocker for starting.
: "${MIN_WALLTIME_MARGIN_S:=300}"
# MIN_RUN_BUDGET_S: a rep is only started if at least this much walltime is
# left on top of MIN_WALLTIME_MARGIN_S, so RUN_TIMEOUT_S is never a few
# seconds (run gets killed) or 0 (run_experiment reads 0 as "no limit").
: "${MIN_RUN_BUDGET_S:=120}"

# --- MPI launch (unchanged from g5k/05-run.sh, the validated fix) -----
: "${MPI_MAP_BY:=slot}"
: "${MPI_BIND_TO:=numa}"

# --- Akypuera runtime buffer (unchanged) -------------------------------
: "${RST_BUFFER_SIZE:=1073741824}"
